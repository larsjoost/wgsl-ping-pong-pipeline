[package]
name = "wgsl-ping-pong-pipeline"
version = "0.1.0"
edition = "2024"
description = "A high-throughput pipelined compute cascade using WGSL and wgpu with isolated per-stage ping-pong buffers for maximum parallel throughput"
license = "MIT"
repository = "https://github.com/larsjoost/wgsl-ping-pong-pipeline"
homepage = "https://github.com/larsjoost/wgsl-ping-pong-pipeline"
documentation = "https://docs.rs/wgsl-ping-pong-pipeline"

[dependencies]
wgpu = { version = "29.0", features = ["spirv", "serde"] }
pollster = { version = "0.3", features = ["macro"] }
bytemuck = { version = "1.12", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
futures-intrusive = "0.5"

[dev-dependencies]

[[example]]
name = "builder_example"
path = "examples/builder_example.rs"


